name: CI — Build & Lint Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  backend-check:
    name: Backend Syntax Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # `node --check src/server.js` only parses that one file, so a syntax error
      # anywhere else in the backend still reached main. Check every file.
      - name: Check syntax (all backend files)
        run: |
          find src scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: backend

      # Unit + route-wiring tests. No database or network access required.
      - name: Run backend tests
        run: npm test
        working-directory: backend
