<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#002147" />
    <!-- Google Analytics 4 (official gtag.js). send_page_view:false because this
         is a React Router SPA — page_view is sent on every route change from
         src/hooks/usePageTracking.js, so navigations are tracked without the
         initial auto page_view double-counting. Measurement IDs are public by
         design (visible in client requests), so hardcoding here is fine. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-STE21TDGS4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-STE21TDGS4', { send_page_view: false });
    </script>
    <!-- SEO-START: the block below is the default fallback for the homepage and
         is replaced per-page at runtime for crawlers by /api/render (server render)
         and at runtime for browsers by the <Seo> component (react-helmet). -->
    <!--SEO-START-->
    <title>Vidyarthi Mitra - Find Your Perfect University in India</title>
    <meta name="description" content="Explore 700+ private, deemed and international universities across India. Compare fees, NAAC grades, NIRF rankings, courses, placements and admissions." />
    <meta name="keywords" content="Indian universities, private universities, deemed universities, NIRF rankings, NAAC grades, college admission India, study abroad India" />
    <link rel="canonical" href="https://privateuniversity.vidyarthimitra.org/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Vidyarthi Mitra" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://privateuniversity.vidyarthimitra.org/" />
    <meta property="og:title" content="Vidyarthi Mitra - Find Your Perfect University" />
    <meta property="og:description" content="Explore 700+ universities in India. Filter by state, NAAC grade, NIRF rank and more." />
    <meta property="og:image" content="https://privateuniversity.vidyarthimitra.org/images/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vidyarthi Mitra - Find Your Perfect University" />
    <meta name="twitter:description" content="Explore 700+ universities in India. Filter by state, NAAC grade, NIRF rank and more." />
    <meta name="twitter:image" content="https://privateuniversity.vidyarthimitra.org/images/logo.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://privateuniversity.vidyarthimitra.org/#organization",
          "name": "Vidyarthi Mitra",
          "url": "https://privateuniversity.vidyarthimitra.org/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://privateuniversity.vidyarthimitra.org/images/logo.png"
          },
          "description": "Explore 700+ private, deemed and international universities across India.",
          "sameAs": ["https://vidyarthimitra.org"]
        },
        {
          "@type": "WebSite",
          "@id": "https://privateuniversity.vidyarthimitra.org/#website",
          "url": "https://privateuniversity.vidyarthimitra.org/",
          "name": "Vidyarthi Mitra",
          "publisher": { "@id": "https://privateuniversity.vidyarthimitra.org/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://privateuniversity.vidyarthimitra.org/universities?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <!--SEO-END-->

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect for Razorpay checkout (loaded dynamically on subscription page) -->
    <link rel="preconnect" href="https://checkout.razorpay.com" />
    <!-- Plus Jakarta Sans (headings) + Playfair Display (Serif) + Inter (body) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
