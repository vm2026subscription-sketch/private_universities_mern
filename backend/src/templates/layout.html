<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; line-height: 1.6; color: #334155; margin: 0; padding: 0; background-color: #f1f5f9; -webkit-font-smoothing: antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f1f5f9;">
    <tr>
      <td align="center" style="padding: 32px 16px;">
        <table role="presentation" width="580" cellpadding="0" cellspacing="0" border="0" style="max-width: 580px; width: 100%;">

          <!-- HEADER: Dark Banner with Logo -->
          <tr>
            <td align="center" style="background-color: #0f172a; padding: 28px 32px; border-radius: 12px 12px 0 0;">
              <img src="https://privateuniversity.vidyarthimitra.org/images/logo.png" alt="Vidyarthi Mitra" width="160" style="display: block; max-width: 160px; height: auto;" />
            </td>
          </tr>

          <!-- MAIN: White Card -->
          <tr>
            <td style="background-color: #ffffff; padding: 36px 32px; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0;">

              <!-- Email-specific content injected here -->
              {{content}}

              <!-- CTA Button (conditional) -->
              {{#if ctaLabel}}
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin: 28px 0 8px 0;">
                <tr>
                  <td align="center">
                    <a href="{{ctaUrl}}" style="display: inline-block; background-color: #ea580c; color: #ffffff; padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; letter-spacing: 0.3px; mso-padding-alt: 0; text-align: center;">
                      <!--[if mso]><i style="mso-font-width: 200%; mso-text-raise: 21pt;">&nbsp;</i><![endif]-->
                      {{ctaLabel}}
                      <!--[if mso]><i style="mso-font-width: 200%;">&nbsp;</i><![endif]-->
                    </a>
                  </td>
                </tr>
              </table>
              {{/if}}

            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background-color: #f8fafc; padding: 24px 32px; border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 12px 12px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="padding-bottom: 12px;">
                    <span style="font-size: 12px; color: #64748b; line-height: 1.8;">
                      Website: <a href="https://privateuniversity.vidyarthimitra.org" style="color: #ea580c; text-decoration: none;">privateuniversity.vidyarthimitra.org</a>
                      <br />
                      Email: <a href="mailto:vidyarthimita.contact@gmail.com" style="color: #ea580c; text-decoration: none;">vidyarthimita.contact@gmail.com</a>
                    </span>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="border-top: 1px solid #e2e8f0; padding-top: 12px;">
                    <span style="font-size: 11px; color: #94a3b8;">
                      &copy; 2026 Vidyarthi Mitra &mdash; Empowering Universities. Guiding Students.
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
